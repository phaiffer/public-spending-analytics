name: "gov_spending_analytics"
version: "0.1.0"
config-version: 2

profile: "gov_spending_analytics"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Staged Parquet files, one per month, written by `gov-spending sync-recebimentos` or
  # `gov-spending stage-recebimentos-favorecido-file`. A glob reads every staged month.
  # Override with --vars to build against another file or glob (for example the CI sample).
  recebimentos_staged_parquet: "../data/staging/portal_transparencia/recebimentos_recursos_por_favorecido/*.parquet"

models:
  gov_spending_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  gov_spending_analytics:
    +schema: seeds
