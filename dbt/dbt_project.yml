name: "gov_spending_analytics"
version: "0.1.0"
config-version: 2

profile: "gov_spending_analytics"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Staged Parquet produced by `gov-spending stage-recebimentos-favorecido-file`.
  # Override with --vars to build against another staged file (for example the CI sample).
  recebimentos_staged_parquet: "../data/staging/portal_transparencia/recebimentos_recursos_por_favorecido/202601_RecebimentosRecursosPorFavorecido.parquet"
  # Must equal row_count of the matching entry in config/source_manifest.toml.
  recebimentos_expected_row_count: 300350

models:
  gov_spending_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  gov_spending_analytics:
    +schema: seeds
