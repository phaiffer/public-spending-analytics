version: 2

models:
  - name: mart_recebimentos_by_beneficiary_month
    description: "First conservative mart-ready monthly view of received resources by beneficiary."
    columns:
      - name: launch_month_key
        description: "Mart month key formatted as YYYYMM."
        tests:
          - not_null
      - name: launch_month_start_date
        description: "First day of the mart month."
        tests:
          - not_null
      - name: beneficiary_id
        description: "Beneficiary identifier preserved as text."
        tests:
          - not_null
      - name: beneficiary_identifier_kind
        description: "Shape of beneficiary_id: cnpj (14 digits), cpf_masked (***.NNN.NNN-**), foreign_code (EX-prefixed, exterior beneficiaries), placeholder (negative codes such as -1 SEM INFORMACAO or -11 Sigiloso), treasury_operation or treasury_payment (RB Treasury bank codes, classified in the treasury_bank_codes seed; treasury_unclassified until reviewed), intergovernmental_transfer (TN codes: transfers to states and municipalities), treasury_management_unit (Treasury management units listed in the treasury_management_units seed), or other_code."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["cnpj", "cpf_masked", "foreign_code", "placeholder", "treasury_operation", "treasury_payment", "treasury_unclassified", "intergovernmental_transfer", "treasury_management_unit", "other_code"]
      - name: beneficiary_name
        description: "Beneficiary name kept in the mart grain because masked CPF values (cpf_masked) are shared by different people, so beneficiary_id alone is not unique enough."
        tests:
          - not_null
      - name: total_amount_received_brl
        description: "Signed monthly received amount aggregated at the mart grain."
        tests:
          - not_null
      - name: total_record_count
        description: "Total number of intermediate rows represented by the mart row."
        tests:
          - not_null
      - name: negative_amount_record_count
        description: "Number of aggregated rows with signed negative amounts."
        tests:
          - not_null

  - name: mart_recebimentos_monthly_summary
    description: "Monthly rollup of received resources by superior government body and beneficiary identifier kind, sized for dashboards."
    columns:
      - name: launch_month_key
        description: "Month key formatted as YYYYMM."
        tests:
          - not_null
      - name: launch_month_start_date
        description: "First day of the month."
        tests:
          - not_null
      - name: superior_government_body_id
        description: "Superior government body identifier from Código Órgão Superior."
        tests:
          - not_null
      - name: superior_government_body_name
        description: "Superior government body name as published for that month; names change across reorganizations."
        tests:
          - not_null
      - name: beneficiary_identifier_kind
        description: "Shape of beneficiary_id; see the staging model."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["cnpj", "cpf_masked", "foreign_code", "placeholder", "treasury_operation", "treasury_payment", "treasury_unclassified", "intergovernmental_transfer", "treasury_management_unit", "other_code"]
      - name: total_amount_received_brl
        description: "Signed received amount summed over the group."
        tests:
          - not_null
      - name: total_record_count
        description: "Number of source rows in the group."
        tests:
          - not_null
      - name: negative_amount_record_count
        description: "Number of source rows with negative amounts in the group."
        tests:
          - not_null

  - name: fact_public_spending
    description: "Future core spending fact table by spending-stage event."
    columns:
      - name: spending_event_id
        description: "Unique spending-stage event identifier."
        tests:
          - unique
          - not_null
      - name: spending_stage
        description: "Commitment, liquidation, or payment."
        tests:
          - accepted_values:
              arguments:
                values: ["commitment", "liquidation", "payment"]
      - name: amount_brl
        description: "Amount in Brazilian reais."
        tests:
          - not_null

  - name: dim_spending_stage
    description: "Controlled spending-stage dimension."
    columns:
      - name: spending_stage
        description: "English analytical spending stage key."
        tests:
          - unique
          - not_null
